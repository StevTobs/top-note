[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: any path that isn't a real file falls back to index.html,
# matching the "navigation fallback" requirement in README.md.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
